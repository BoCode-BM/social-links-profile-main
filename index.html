<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Mentor | Social links profile</title>

    <!-- Assurez-vous que Tailwind CSS est bien chargé. 
         Si vous utilisez un CDN pour le développement, décommentez la ligne ci-dessous : -->
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./public/images/favicon-32x32.png"
    />

    <style>
      /* Styles personnalisés si nécessaire */
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
        margin-top: 2rem;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
        text-decoration: none;
      }
      .attribution a:hover {
        text-decoration: underline;
      }

      /* Styles pour les boutons de lien */
      .social-link {
        display: block;
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        transition: all 0.2s ease;
        font-weight: 600;
        text-decoration: none;
      }
      .social-link:hover {
        transform: translateY(-2px);
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
    </style>
  </head>
  <body
    class="w-full min-h-screen bg-grey-900 text-white flex justify-center items-center p-4"
  >
    <main>
      <section>
        <article
          class="w-full bg-grey-800 max-w-[355px] pt-8 px-6 pb-8 rounded-2xl md:min-w-[380px] shadow-xl"
        >
          <figure class="flex justify-center items-center mb-8">
            <img
              src="./public/images/avatar-jessica.jpeg"
              alt="Photo de profil de Jessica Randall"
              class="rounded-full block w-[90px] h-[90px] object-cover"
            />
          </figure>

          <h1 class="text-white font-black text-2xl text-center mb-2">
            Jessica Randall
          </h1>

          <span
            class="text-green font-bold flex justify-center items-center mb-6 text-base"
          >
            London, United Kingdom
          </span>

          <p class="text-center text-[15px] text-grey-300 px-4 mb-8 md:text-[16px]">
            "Front-end developer and avid reader."
          </p>

          <ul class="flex flex-col gap-3 text-center">
            <li>
              <a> GitHub </a>
            </li>
            <li>
              <a> Frontend Mentor </a>
            </li>
            <li>
              <a> LinkedIn </a>
            </li>
            <li>
              <a> Twitter </a>
            </li>
            <li>
              <a> Instagram </a>
            </li>
          </ul>
        </article>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
